image: eclipse-temurin:17-jdk

stages:
  - test

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

cache:
  key: gradle-cache
  paths:
    - .gradle/wrapper
    - .gradle/caches

unit_tests:
  stage: test
  script:
    - chmod +x ./gradlew
    - ./gradlew --version
    - ./gradlew test --no-daemon
  artifacts:
    when: always
    reports:
      junit: app/build/test-results/test*/TEST-*.xml
    paths:
      - app/build/reports/tests/

